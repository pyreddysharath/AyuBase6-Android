apply plugin: 'com.android.application'

android {
    namespace = "com.ayubase6.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ayubase6.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "0.1." + (System.getenv("VERSION_CODE") ?: "0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing comes only from the build machine's environment (GitHub secrets); no key or password is in the repo.
    signingConfigs {
        release {
            if (System.getenv("RELEASE_KEYSTORE")) {
                storeFile file(System.getenv("RELEASE_KEYSTORE"))
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }
    buildFeatures { buildConfig = true }
    // Two versions of the same app (same app ID and signing key, so one can update the other):
    //   website: the APK on ayubase6.com; it says when a new version is ready and the download opens in the browser
    //   play:    the Google Play bundle; Google Play updates it
    flavorDimensions = ["store"]
    productFlavors {
        website { dimension "store" }
        play {
            dimension "store"
            // Google Play numbering starts at 1 and is set by hand in play/version.properties (raised before each Play upload)
            def pv = new Properties()
            def pf = rootProject.file('../play/version.properties')
            if (pf.exists()) pf.withInputStream { pv.load(it) }
            versionCode Integer.parseInt(pv.getProperty('code', '1').trim())
            versionName pv.getProperty('name', '1.0.0').trim()
        }
    }
    buildTypes {
        release {
            if (System.getenv("RELEASE_KEYSTORE")) signingConfig signingConfigs.release
            // Shrink the release APK (unused code removed). Names are NOT obfuscated (proguard-rules.pro: -dontobfuscate):
            // an obfuscated APK from outside Google Play is more likely to be flagged by Play Protect.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    // Google Mobile Ads SDK, only for the WebView API for Ads (the website's AdSense in the app; no AdMob account needed)
    implementation "com.google.android.gms:play-services-ads:23.6.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
